<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Thro Hulls</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thro Hulls">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Thro Hulls: phone app, one column. Jobs list -> job (Drawing / Table / Output) -> fitting sheet */
:root{
  --bg:#f6f4f3; --surface:#ffffff; --ink:#1f1a1a; --muted:#6d6363; --line:#e2dcda;
  --accent:#990000; --accent-ink:#ffffff; --accent-soft:#f5e3e1; --ok:#2f6b3a; --warn:#9a5a00; --paper:#ffffff; --pen:#22201b;
  --sans:"Gill Sans","Gill Sans MT",Calibri,"Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161212; --surface:#211b1b; --ink:#f1eceb; --muted:#a99d9c; --line:#3a3030;
  --accent:#e0605a; --accent-ink:#1a0d0c; --accent-soft:#3a1f1d; --ok:#7cc488; --warn:#e2a54c; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:8px;min-height:52px}
.bar h1{font-size:19px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
main{padding:14px max(14px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:46px;width:100%}
textarea{min-height:66px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:60px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:14px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:3px 9px;white-space:nowrap;border:1px solid}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.hulls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hull{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.hull svg{width:100%;height:84px}
.hull.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.head{position:sticky;top:0;z-index:5}.head .bar,.head .tabs{position:static}
.tabs{display:flex;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:4}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
/* drawing */
.draw{position:fixed;left:0;right:0;bottom:0;top:100px;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;position:relative;background:var(--paper);touch-action:none;overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--pen);color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:44px;padding:0;font-size:22px;line-height:1}
.tools{background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;
  padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.tools .btn{flex:1 1 0;white-space:nowrap;padding-inline:6px}
.appx{display:flex;flex-wrap:wrap;gap:6px;padding:8px max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));background:var(--surface);border-top:1px solid var(--line)}
.appx .btn{min-height:38px;font-size:15px;padding:5px 10px}
.appx p{margin:0 0 4px;width:100%;font-size:13px;color:var(--muted)}
/* table */
.fit{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px}
.fit .id{font-weight:700;font-size:18px;min-width:38px;height:38px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.fit .id.bw{background:var(--pen);color:#fff}
.fit .d{flex:1;min-width:0;font-size:15px}
.fit .d b{display:block;font-size:16px}
.fit .d span{color:var(--muted)}
.fit .site{font-size:12px;color:var(--muted);white-space:nowrap}
.preview{background:#fff;border:1px solid var(--line);border-radius:8px;width:100%;height:auto;display:block}
.msg{font-size:15px;color:var(--muted)} .msg.err{color:var(--accent)} .msg a{color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sheet .body{flex:1;overflow-y:auto;padding:14px max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left))}
.sheet .inner{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:13px}
.sheet .foot{border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px;padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.sheet .foot .btn{flex:1}
.bigid{font-size:24px;font-weight:700;color:var(--accent);min-width:38px;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:10px 6px;font-weight:600;color:var(--muted);min-height:44px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.other{margin-top:6px}
.small{font-size:13px;color:var(--muted)}
</style>
</head>

function drawInner(j){
  var o='<rect x="-2000" y="-2000" width="5000" height="5500" fill="#fff"/>';
  if(j.hull==="sketch"&&S.imgs[j.id])o+='<image href="'+S.imgs[j.id]+'" x="0" y="0" width="1000" height="1500" preserveAspectRatio="xMidYMid meet" opacity=".85"/>';
  o+=frameSvg(j)+appxSvg(j,true);
  fits(j).forEach(function(f){o+=markerSvg(f,f.id,S.ms||1)});

function calcMs(){var s=document.getElementById("svg");if(!s)return;var r=s.getBoundingClientRect();if(!r.width)return;var ppu=Math.min(r.width/S.vb.w,r.height/S.vb.h);S.ms=Math.max(.6,Math.min(3,(15/34)/ppu))}
function redrawSvg(j){calcMs();var s=document.getElementById("svg");if(s){s.innerHTML=drawInner(j);s.setAttribute("viewBox",[S.vb.x,S.vb.y,S.vb.w,S.vb.h].join(" "))}}
function svgPt(svg,e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function clampVb(){var v=S.vb;v.w=Math.max(250,Math.min(1000,v.w));v.h=v.w*1.5;v.x=Math.max(0,Math.min(1000-v.w,v.x));v.y=Math.max(0,Math.min(1500-v.h,v.y))}
function zoom(f,cx,cy){var v=S.vb;if(cx==null){cx=v.x+v.w/2;cy=v.y+v.h/2}var nw=v.w*f;v.x=cx-(cx-v.x)*nw/v.w;v.y=cy-(cy-v.y)*nw/v.w;v.w=nw;clampVb();redrawSvg(cur())}
function bindDraw(j){
  var svg=document.getElementById("svg"),tb=app.querySelector(".tabs");if(tb)document.getElementById("draw").style.top=Math.round(tb.getBoundingClientRect().bottom)+"px";
  document.getElementById("addwl").onclick=function(){S.mode=S.mode==="wl"?"":"wl";S.arrange=false;render()};
  document.getElementById("addbw").onclick=function(){S.mode=S.mode==="bw"?"":"bw";S.arrange=false;render()};
  document.getElementById("arr").onclick=function(){S.arrange=!S.arrange;S.mode="";render()};
  redrawSvg(j);
  document.getElementById("zin").onclick=function(){zoom(.6)};
  document.getElementById("zout").onclick=function(){zoom(1/.6)};
  app.querySelectorAll("[data-ax]").forEach(function(b){b.onclick=function(){var a=j.appx[b.dataset.ax];a.on=!a.on;persist(j);render()}});
  var ph=document.getElementById("photo");if(ph)ph.onchange=function(){if(ph.files[0])loadPhoto(j,ph.files[0])};
  var rp=document.getElementById("rmphoto");if(rp)rp.onclick=function(){delete S.imgs[j.id];idb("img","readwrite",function(s){return s.delete(j.id)});persist(j);render()};
  var drag=null;
  svg.addEventListener("pointerdown",function(e){
    var p=svgPt(svg,e),t=e.target,g=t.closest("[data-fid]"),ap=t.getAttribute("data-ap");
    if(S.arrange&&ap){var a=j.appx[ap];drag={type:"ap",k:ap,part:t.getAttribute("data-part"),p0:p,a0:JSON.parse(JSON.stringify(a)),moved:false}}
    else if(g&&!S.arrange){var f=j.fits[g.dataset.fid];drag={type:"fit",f:f,p0:p,x0:f.x,y0:f.y,sx:e.clientX,sy:e.clientY,moved:false}}
    else drag={type:"bg",p0:p,vb0:Object.assign({},S.vb),sx:e.clientX,sy:e.clientY,moved:false};
    svg.setPointerCapture(e.pointerId);e.preventDefault();
  });
  svg.addEventListener("pointermove",function(e){
    if(!drag)return;var p=svgPt(svg,e);
    if(drag.type==="fit"){if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8)return;drag.moved=true;
      var f=drag.f;f.x=Math.max(0,Math.min(1000,drag.x0+p.x-drag.p0.x));f.y=Math.max(0,Math.min(1500,drag.y0+p.y-drag.p0.y));redrawSvg(j)}
    else if(drag.type==="ap"){drag.moved=true;var a=j.appx[drag.k],dy=p.y-drag.p0.y,a0=drag.a0;
      if(drag.part==="body"){a.y=a0.y+dy;if(drag.k==="bilge")a.dx=Math.max(40,Math.min(300,Math.abs(a0.dx+(p.x>500?1:-1)*(p.x-drag.p0.x))))}
      else{var top=a0.y-a0.len/2,bot=a0.y+a0.len/2;if(drag.part==="top")top=Math.min(bot-40,top+dy);else bot=Math.max(top+40,bot+dy);a.y=(top+bot)/2;a.len=bot-top}
      redrawSvg(j)}
    else if(drag.type==="bg"&&S.vb.w<1000){var r=svg.getBoundingClientRect(),k=S.vb.w/Math.min(r.width,r.height*2/3);
      S.vb.x=drag.vb0.x-(e.clientX-drag.sx)*k;S.vb.y=drag.vb0.y-(e.clientY-drag.sy)*k;if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;clampVb();redrawSvg(j)}
  });
  svg.addEventListener("pointerup",function(e){
    var d=drag;drag=null;if(!d)return;var p=svgPt(svg,e);
    if(d.type==="fit"){if(d.moved){if(d.f.locAuto!==false){var l=autoLoc(j,d.f.x,d.f.y);d.f.location=l;d.f.locAuto=true}persist(j);redrawSvg(j)}else{S.fit=d.f.fid;S.confirmFit=false;renderSheet()}}
    else if(d.type==="ap"){if(d.moved)persist(j)}
    else if(d.type==="bg"&&!d.moved&&S.mode){
      var kind=S.mode,fid=uid(),f={fid:fid,kind:kind,id:nextId(j,kind),x:Math.round(p.x),y:Math.round(p.y),locAuto:true};
      f.location=autoLoc(j,f.x,f.y);j.fits[fid]=f;persist(j);S.mode="";S.fit=fid;S.confirmFit=false;render();
    }
  });
  svg.addEventListener("pointercancel",function(){drag=null});
}
function loadPhoto(j,file){
  var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var sc=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);var d=c.toDataURL("image/jpeg",.8);URL.revokeObjectURL(u);
    S.imgs[j.id]=d;idb("img","readwrite",function(s){return s.put(d,j.id)});persist(j);render()};
  img.onerror=function(){toast("That photo couldn't be opened.",true)};img.src=u;

  var jd=document.getElementById("jdel");if(jd)jd.onclick=function(){S.confirmDel=true;render()};
  var jy=document.getElementById("jdelyes");if(jy)jy.onclick=function(){var id=j.id;clearTimeout(saveTimers[id]);delete saveTimers[id];delete S.jobs[id];delete S.imgs[id];
    idb("jobs","readwrite",function(s){return s.delete(id)});idb("img","readwrite",function(s){return s.delete(id)});S.view="home";S.job=null;S.confirmDel=false;render()};
  var jn=document.getElementById("jdelno");if(jn)jn.onclick=function(){S.confirmDel=false;render()};
}

/* ---- output ---- */
function reportRows(list,m){return list.map(function(f){return[m[f.fid],f.location||"",f.compartment||"",f["function"]||"",withMat(f.skin,f.skinMat),withMat(f.valve,f.valveMat),f.hose||"",f.clamps||"",comment(f)]})}
function sheetRows(j,o){
  var rows=[["Vessel",j.vessel],["Survey date",ukDate(j.date)],["Hull form",HULLS[j.hull].name],[],
    ["Through Hulls ID","Report ID","Location","Compartment","Waterline","Function","Skin fitting","Skin fitting Material","Valve","Valve Material","Hose","Clamps","Comment"]];
  o.L.concat(o.N).forEach(function(f){rows.push([f.id,o.m[f.fid],f.location,f.compartment,WL_TEXT[f.kind],f["function"],f.skin,f.skinMat,f.valve,f.valveMat,f.hose,f.clamps,comment(f)])});
  return rows.map(function(r){var a=[];for(var i=0;i<13;i++)a.push(r[i]==null?"":String(r[i]));return a});
}
function exportSvg(j,o){
  /* A4 portrait at 150 dpi: 1240 x 1754 */
  var W=1240,H=1754,s=1350/1500,ox=(W-1000*s)/2,oy=70;
  var g='<g transform="translate('+ox+','+oy+') scale('+s+')">'+frameSvg(j)+appxSvg(j,false);
  o.L.concat(o.N).forEach(function(f){g+=markerSvg(f,o.m[f.fid],1)});g+='</g>';
  var F='font-family="Gill Sans,Gill Sans MT,Calibri,sans-serif"',ky=oy+1500*s+40;
  var key='<text x="110" y="'+ky+'" '+F+' font-size="17" letter-spacing="3" fill="#8a8580">KEY</text>';
  [["wl","A"],["bw","1"]].forEach(function(k,i){var y=ky+i*34;
    key+='<path d="M'+(190)+','+(y-15)+'l16,16m0,-16l-16,16" stroke="'+(k[0]==="wl"?"#990000":"#22201b")+'" stroke-width="3.5" stroke-linecap="round"/><text x="214" y="'+y+'" '+F+' font-size="22" font-weight="700" fill="'+(k[0]==="wl"?"#990000":"#22201b")+'">'+k[1]+'</text><text x="250" y="'+y+'" '+F+' font-size="21" fill="#22201b">'+KEY_TEXT[k[0]]+'</text>'});
  var anyAp=APPX_ORDER.some(function(k){return j.appx[k]&&j.appx[k].on});
  if(anyAp)key+='<path d="M180,'+(ky+58)+'h40" stroke="#6b6560" stroke-width="3" stroke-dasharray="12 8"/><text x="250" y="'+(ky+66)+'" '+F+' font-size="21" fill="#22201b">Keel / skeg (below hull)</text>';
  key+='<text x="250" y="'+(ky+(anyAp?100:66))+'" '+F+' font-size="19" font-style="italic" fill="#8a8580">Not to scale</text>';
  var foot='<line x1="110" y1="'+(H-90)+'" x2="'+(W-110)+'" y2="'+(H-90)+'" stroke="#d8d4cc" stroke-width="2"/><text x="110" y="'+(H-50)+'" '+F+' font-size="24" font-weight="700" fill="#22201b">Sketch of Through-Hull Apertures</text>'+
    '<text x="'+(W-110)+'" y="'+(H-50)+'" text-anchor="end" '+F+' font-size="24" fill="#22201b"><tspan font-weight="700" font-style="italic">'+esc(j.vessel)+'</tspan><tspan fill="#8a8580" dx="18">'+ukDate(j.date)+'</tspan></text>';
  return {W:W,H:H,s:s,ox:ox,oy:oy,svg:'<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+g+key+foot+'</svg>'};
}
function exportPng(j){
  var o=order(j),e=exportSvg(j,o);
  return new Promise(function(res,rej){
    var c=document.createElement("canvas");c.width=e.W;c.height=e.H;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,e.W,e.H);
    function overlay(){var im=new Image();im.onload=function(){x.drawImage(im,0,0);c.toBlob(function(b){b?res(b):rej(new Error("png"))},"image/png")};im.onerror=function(){rej(new Error("svg"))};
      im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(e.svg)}
    var bg=j.hull==="sketch"&&S.imgs[j.id];
    if(bg){var bi=new Image();bi.onload=function(){var fw=1000*e.s,fh=1500*e.s,r=Math.min(fw/bi.width,fh/bi.height),w=bi.width*r,h=bi.height*r;
      x.globalAlpha=.85;x.drawImage(bi,e.ox+(fw-w)/2,e.oy+(fh-h)/2,w,h);x.globalAlpha=1;overlay()};bi.onerror=overlay;bi.src=bg}else overlay();
  });
}
function blobB64(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(String(r.result).split(",")[1])};r.readAsDataURL(b)})}
function outHtml(j){
  var c=cfg(),n=fits(j).length;
  var h='<main><section><h2>Report drawing</h2>'+(S.previewUrl?'<img class="preview" id="pv" src="'+S.previewUrl+'" alt="Through-hull drawing for '+esc(j.vessel)+'">':'<p class="empty">Preparing preview…</p>')+'</section>';
  h+='<section class="panel"><b>Save to Google Drive</b><span class="small">Creates a folder “'+esc(j.vessel+" "+j.date)+'” in Surveying › Thro Hulls holding the drawing (PNG), a Word file with the drawing and both tables, and the full table as a Google Sheet. Files you have edited on Drive are never overwritten; a new copy is made instead.</span>';
  if(!c.url)h+='<span class="msg err">Add the Apps Script URL and key in Settings first.</span>';
  h+='<button class="btn primary" id="drive"'+(S.busy||!c.url||!n?" disabled":"")+'>'+(S.busy?"Saving…":"Save to Drive")+'</button><p class="msg'+(S.msgErr?" err":"")+'" id="toast">'+(S.msg?esc(S.msg):dirty(j)?(j.savedAt?"Changed since last save.":"Not yet saved to Drive."):"Saved to Drive "+new Date(j.savedAt).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+".")+(j.folderUrl?' <a href="'+esc(j.folderUrl)+'" target="_blank" rel="noopener">Open folder</a>':'')+'</p></section>';
  h+='<section class="panel"><b>Share drawing</b><span class="small">Sends the PNG to another app (Mail, Files, OneDrive). Works without signal for saving to Files.</span><button class="btn" id="share"'+(n?"":" disabled")+'>Share drawing</button></section></main>';
  return h;
}
function bindOut(j){
  if(!S.previewUrl)exportPng(j).then(function(b){S.previewUrl=URL.createObjectURL(b);if(S.tab==="out"&&S.view==="job")render()}).catch(function(){});
  var d=document.getElementById("drive");if(d)d.onclick=function(){saveDrive(j)};
  var s=document.getElementById("share");if(s)s.onclick=function(){exportPng(j).then(function(b){var name=baseName(j)+".png",file=new File([b],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file]}).catch(function(){});
    else{var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}})};
}
function saveDrive(j){
  var c=cfg();if(!c.url||S.busy)return;S.busy=true;S.msg="Saving to Drive…";S.msgErr=false;render();
  var stamp=j.updatedAt,o=order(j);
  exportPng(j).then(blobB64).then(function(b64){
    var body={key:c.key,vessel:j.vessel,date:j.date,dateUk:ukDate(j.date),hull:HULLS[j.hull].name,sheet:sheetRows(j,o),wl:reportRows(o.L,o.m),below:reportRows(o.N,o.m),png:b64,
      hasAppx:APPX_ORDER.some(function(k){return j.appx[k]&&j.appx[k].on})};
    return fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  }).then(function(r){return r.json()}).then(function(d){
    S.busy=false;
    if(!d.ok){S.msg="Drive refused the save: "+(d.error||"unknown error");S.msgErr=true;render();return}
    j.savedAt=Math.max(stamp,Date.now());j.updatedAt=stamp;j.folderUrl=d.folderUrl;flush(j.id);
    var kept=(d.files||[]).filter(function(f){return f.status==="copy"});
    S.msg="Saved to Drive."+(kept.length?" You had edited "+kept.map(function(f){return f.was}).join(" and ")+" on Drive, so "+(kept.length>1?"new copies were":"a new copy was")+" saved beside "+(kept.length>1?"them":"it")+".":"");S.msgErr=false;render();
  }).catch(function(){S.busy=false;S.msg="Couldn't reach Drive. Nothing is lost; try again when you have signal.";S.msgErr=true;render()});
}

/* ---------------- start ---------------- */
dbAll().then(function(list){
  list.forEach(function(j){S.jobs[j.id]=j});
  var u=ls("ui");if(u&&u.job&&S.jobs[u.job]){open(u.job,u.tab||"draw")}else render();
});
var _r=render;render=function(){if(S.view!=="job"||S.tab!=="out"){if(S.previewUrl){URL.revokeObjectURL(S.previewUrl);S.previewUrl=""}}_r()};
window.addEventListener("resize",function(){if(S.view==="job"&&S.tab==="draw")redrawSvg(cur())});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
