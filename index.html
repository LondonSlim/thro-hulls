<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Thro Hulls</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Thro Hulls: phone app, one column. Jobs list -> job (Drawing / Table / Output) -> fitting sheet */
:root{
  --bg:#f6f4f3; --surface:#ffffff; --ink:#1f1a1a; --muted:#6d6363; --line:#e2dcda;
  --accent:#990000; --accent-ink:#ffffff; --accent-soft:#f5e3e1; --ok:#2f6b3a; --warn:#9a5a00; --paper:#ffffff; --pen:#22201b;
  --sans:"Gill Sans","Gill Sans MT",Calibri,"Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161212; --surface:#211b1b; --ink:#f1eceb; --muted:#a99d9c; --line:#3a3030;
  --accent:#e0605a; --accent-ink:#1a0d0c; --accent-soft:#3a1f1d; --ok:#7cc488; --warn:#e2a54c; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:8px;min-height:52px}
.bar h1{font-size:19px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
main{padding:14px max(14px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:46px;width:100%}
textarea{min-height:66px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:60px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:14px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:3px 9px;white-space:nowrap;border:1px solid}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.hulls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hull{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.hull svg{width:100%;height:84px}
.hull.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.head{position:sticky;top:0;z-index:5}.head .bar,.head .tabs{position:static}
.tabs{display:flex;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:4}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
/* drawing */
.draw{position:fixed;left:0;right:0;bottom:0;top:100px;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;position:relative;background:var(--paper);touch-action:none;overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--pen);color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:44px;padding:0;font-size:22px;line-height:1}
.tools{background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;
  padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.tools .btn{flex:1 1 0;white-space:nowrap;padding-inline:6px}
.appx{display:flex;flex-wrap:wrap;gap:6px;padding:8px max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));background:var(--surface);border-top:1px solid var(--line)}
.appx .btn{min-height:38px;font-size:15px;padding:5px 10px}
.appx p{margin:0 0 4px;width:100%;font-size:13px;color:var(--muted)}
/* table */
.fit{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px}
.fit .id{font-weight:700;font-size:18px;min-width:38px;height:38px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.fit .id.bw{background:var(--pen);color:#fff}
.fit .d{flex:1;min-width:0;font-size:15px}
.fit .d b{display:block;font-size:16px}
.fit .d span{color:var(--muted)}
.fit .site{font-size:12px;color:var(--muted);white-space:nowrap}
.preview{background:#fff;border:1px solid var(--line);border-radius:8px;width:100%;height:auto;display:block}
.msg{font-size:15px;color:var(--muted)} .msg.err{color:var(--accent)} .msg a{color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sheet .body{flex:1;overflow-y:auto;padding:14px max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left))}
.sheet .inner{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:13px}
.sheet .foot{border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px;padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.sheet .foot .btn{flex:1}
.bigid{font-size:24px;font-weight:700;color:var(--accent);min-width:38px;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:10px 6px;font-weight:600;color:var(--muted);min-height:44px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.other{margin-top:6px}
.small{font-size:13px;color:var(--muted)}
.fit .id.red{background:#fde8e6;color:#c4120c;outline:2px solid #c4120c}
.notes p,.notes li{font-size:15px;line-height:1.45;margin:0 0 8px}
.notes h3{font-size:16px;margin:14px 0 6px}
.notes table{border-collapse:collapse;font-size:14px;width:100%}
.notes td,.notes th{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.notes ul{padding-left:20px;margin:0 0 8px}
.hwl{font-size:15px;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
</style>
</head>

/* ---- numbering ---- */
function reportOrder(j){
  var W=[],B=[];fits(j).forEach(function(f){(f.kind==="wl"?W:B).push(f)});
  var pl={};W.forEach(function(f){pl[f.fid]=placeOf(j,f,R0)});
  var port=W.filter(function(f){return!pl[f.fid].transom&&f.x<500}).sort(function(a,b){return pl[a.fid].y-pl[b.fid].y}),
      stbd=W.filter(function(f){return!pl[f.fid].transom&&f.x>=500}).sort(function(a,b){return pl[a.fid].y-pl[b.fid].y}),
      tran=W.filter(function(f){return pl[f.fid].transom}).sort(function(a,b){return a.x-b.x});
  B.sort(function(a,b){return a.y-b.y||a.x-b.x});
  var m={};port.concat(stbd,tran).forEach(function(f,i){m[f.fid]=letter(i)});B.forEach(function(f,i){m[f.fid]=String(i+1)});
  return m;
}
function inOrder(j){var m=reportOrder(j);return fits(j).every(function(f){return m[f.fid]===f.id})}
function renumber(j){var m=reportOrder(j);fits(j).forEach(function(f){f.id=m[f.fid]});persist(j)}
function nextId(j,kind,except){var used={};fits(j).forEach(function(f){if(f.kind===kind&&f.fid!==except)used[f.id]=1});
  for(var i=0;i<999;i++){var id=kind==="wl"?letter(i):String(i+1);if(!used[id])return id}}
function defaultsAppx(h){
  var b=hullGeo(h),L=b.bot-b.top,on=APPX_DEFAULT_ON[h]||[],o={};
  var p={fin:{y:b.top+.52*L,len:.28*L},long:{y:b.top+.55*L,len:.62*L},bilge:{y:b.top+.55*L,len:.28*L,dx:Math.min(130,(b.right-b.left)*.26)},aftSkeg:{y:b.bot-.11*L,len:.16*L},fwdSkeg:{y:b.top+.14*L,len:.14*L}};
  APPX_ORDER.forEach(function(k){o[k]=Object.assign({on:on.indexOf(k)>=0},p[k])});return o;
}
function migrate(j){
  if(!j.vtype)j.vtype="motor";if(!j.inspect)j.inspect=400;if(!j.beamUnit)j.beamUnit="ft";if(!j.appx)j.appx=defaultsAppx(j.hull);
  fits(j).forEach(function(f){if(!f.skin&&f.skinMat)f.skin=f.skinMat;delete f.skinMat;delete f.location;delete f.locAuto});
  return j;
}

/* ================= drawing (screen and export share these) ================= */
function appxSvg(j,interactive){
  var out="",A=j.appx||{};
  APPX_ORDER.forEach(function(k){var a=A[k];if(!a||!a.on)return;var y0=a.y-a.len/2,y1=a.y+a.len/2;
    var st='fill="none" stroke="#6b6560" stroke-width="3" stroke-dasharray="12 8"';
    if(k==="fin")out+='<ellipse cx="500" cy="'+a.y+'" rx="20" ry="'+a.len/2+'" '+st+'/>';
    else if(k==="long")out+='<rect x="485" y="'+y0+'" width="30" height="'+a.len+'" rx="15" '+st+'/>';
    else if(k==="bilge")out+='<ellipse cx="'+(500-a.dx)+'" cy="'+a.y+'" rx="13" ry="'+a.len/2+'" '+st+'/><ellipse cx="'+(500+a.dx)+'" cy="'+a.y+'" rx="13" ry="'+a.len/2+'" '+st+'/>';
    else out+='<rect x="489" y="'+y0+'" width="22" height="'+a.len+'" rx="7" '+st+'/>';
    if(interactive&&S.arrange){var xs=k==="bilge"?[500-a.dx,500+a.dx]:[500];
      xs.forEach(function(x){out+='<rect data-ap="'+k+'" data-part="body" x="'+(x-34)+'" y="'+y0+'" width="68" height="'+a.len+'" fill="rgba(153,0,0,.08)" stroke="#990000" stroke-width="2"/>'});
      out+='<circle data-ap="'+k+'" data-part="top" cx="'+xs[xs.length-1]+'" cy="'+y0+'" r="22" fill="#990000"/><circle data-ap="'+k+'" data-part="bot" cx="'+xs[xs.length-1]+'" cy="'+y1+'" r="22" fill="#990000"/>';}
  });
  return out;
}
var GILL='font-family="Gill Sans,Gill Sans MT,Calibri,Carlito,sans-serif"';
function frameSvg(j){
  var g=hullGeo(j.hull),h=HULLS[j.hull],o="";
  if(h.d)o+='<path d="'+h.d+'" fill="none" stroke="#000" stroke-width="3.2"/>';
  o+='<line x1="500" y1="'+(g.top-35)+'" x2="500" y2="'+(g.bot+70)+'" stroke="#000" stroke-width="1.6" stroke-dasharray="11 9" opacity=".45"/>';
  o+='<text x="372" y="'+(g.top-20)+'" text-anchor="end" '+GILL+' font-size="30" letter-spacing="4" fill="#777">PORT</text>';
  o+='<text x="628" y="'+(g.top-20)+'" '+GILL+' font-size="30" letter-spacing="4" fill="#777">STBD</text>';
  o+='<text x="500" y="'+(g.bot+108)+'" text-anchor="middle" font-family="Times New Roman,Georgia,serif" font-style="italic" font-size="36" fill="#777">CL</text>';
  return o;
}
function markersSvg(j,R,FS,colour,interactive){
  var o="";
  layout(j,fits(j),R,FS).forEach(function(it){
    var c=colour?(complete(it.f)?"#000":"#c4120c"):"#000";
    o+='<g'+(interactive?' data-fid="'+it.f.fid+'"':'')+'>'+(interactive?'<circle cx="'+it.x+'" cy="'+it.y+'" r="'+(R*3.2)+'" fill="transparent"/>':'')+
      '<circle cx="'+it.x+'" cy="'+it.y+'" r="'+R+'" fill="#fff" stroke="'+c+'" stroke-width="'+(R/2)+'"/>'+
      '<text x="'+it.lx+'" y="'+(it.ly+FS*.36)+'" text-anchor="middle" '+GILL+' font-weight="700" font-size="'+FS+'" fill="'+c+'">'+esc(it.t)+'</text></g>';
  });
  return o;
}

/* ---- drawing tab ---- */
function drawHtml(j){
  var h='<div class="draw" id="draw"><div class="stage" id="stage"><svg id="svg" viewBox="'+[S.vb.x,S.vb.y,S.vb.w,S.vb.h].join(" ")+'" preserveAspectRatio="xMidYMid meet"></svg>';

  if(hint)h+='<div class="hint">'+hint+'</div>';

  if(S.arrange){h+='<div class="appx"><p>Show on drawing</p>';APPX_ORDER.forEach(function(k){h+='<button class="btn'+(j.appx[k].on?" on":"")+'" data-ax="'+k+'">'+APPX_NAME[k]+'</button>'});h+='</div>'}
  else if(j.hull==="sketch"){h+='<div class="appx"><p>'+(S.imgs[j.id]?"Your sketch is under the drawing.":"Add a photo of your sketch or a plan to draw over.")+'</p><label class="btn" style="flex:1;text-align:center">'+(S.imgs[j.id]?"Replace photo":"Add photo")+'<input type="file" accept="image/*" id="photo" hidden></label>'+(S.imgs[j.id]?'<button class="btn" id="rmphoto" style="flex:1">Remove photo</button>':'')+'</div>'}
  h+='<div class="tools"><button class="btn'+(S.mode==="wl"?" on":"")+'" id="addwl">+ A  (≤'+j.inspect+' mm)</button><button class="btn'+(S.mode==="bw"?" on":"")+'" id="addbw">+ 1  (below WL)</button><button class="btn'+(S.arrange?" on":"")+'" id="arr">Keels</button></div></div>';
  return h;
}
function drawInner(j){
  var o='<rect x="-2000" y="-2000" width="5000" height="5500" fill="#fff"/>';
  if(j.hull==="sketch"&&S.imgs[j.id])o+='<image href="'+S.imgs[j.id]+'" x="0" y="0" width="1000" height="1500" preserveAspectRatio="xMidYMid meet" opacity=".85"/>';
  return o+frameSvg(j)+appxSvg(j,true)+markersSvg(j,R0*S.ms,FS0*S.ms,true,true);
}
function calcMs(){var s=document.getElementById("svg");if(!s)return;var r=s.getBoundingClientRect();if(!r.width)return;var ppu=Math.min(r.width/S.vb.w,r.height/S.vb.h);S.ms=Math.max(.6,Math.min(3,(14/FS0)/ppu))}
function redrawSvg(j){calcMs();var s=document.getElementById("svg");if(s){s.innerHTML=drawInner(j);s.setAttribute("viewBox",[S.vb.x,S.vb.y,S.vb.w,S.vb.h].join(" "))}}
function svgPt(svg,e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function clampVb(){var v=S.vb;v.w=Math.max(250,Math.min(1000,v.w));v.h=v.w*1.5;v.x=Math.max(0,Math.min(1000-v.w,v.x));v.y=Math.max(0,Math.min(1500-v.h,v.y))}
function zoom(f){var v=S.vb,cx=v.x+v.w/2,cy=v.y+v.h/2,nw=v.w*f;v.x=cx-(cx-v.x)*nw/v.w;v.y=cy-(cy-v.y)*nw/v.w;v.w=nw;clampVb();redrawSvg(cur())}
function bindDraw(j){
  var svg=document.getElementById("svg"),tb=app.querySelector(".tabs");if(tb)document.getElementById("draw").style.top=Math.round(tb.getBoundingClientRect().bottom)+"px";
  redrawSvg(j);
  document.getElementById("addwl").onclick=function(){S.mode=S.mode==="wl"?"":"wl";S.arrange=false;render()};
  document.getElementById("addbw").onclick=function(){S.mode=S.mode==="bw"?"":"bw";S.arrange=false;render()};
  document.getElementById("arr").onclick=function(){S.arrange=!S.arrange;S.mode="";render()};
  document.getElementById("zin").onclick=function(){zoom(.6)};
  document.getElementById("zout").onclick=function(){zoom(1/.6)};
  app.querySelectorAll("[data-ax]").forEach(function(b){b.onclick=function(){var a=j.appx[b.dataset.ax];a.on=!a.on;persist(j);render()}});
  var ph=document.getElementById("photo");if(ph)ph.onchange=function(){if(ph.files[0])loadPhoto(j,ph.files[0])};
  var rp=document.getElementById("rmphoto");if(rp)rp.onclick=function(){delete S.imgs[j.id];idb("img","readwrite",function(s){return s.delete(j.id)});persist(j);render()};
  var drag=null;
  svg.addEventListener("pointerdown",function(e){
    var p=svgPt(svg,e),t=e.target,g=t.closest("[data-fid]"),ap=t.getAttribute("data-ap");
    if(S.arrange&&ap){drag={type:"ap",k:ap,part:t.getAttribute("data-part"),p0:p,a0:JSON.parse(JSON.stringify(j.appx[ap])),moved:false}}
    else if(g&&!S.arrange&&!S.mode){var f=j.fits[g.dataset.fid];drag={type:"fit",f:f,p0:p,x0:f.x,y0:f.y,sx:e.clientX,sy:e.clientY,moved:false}}
    else drag={type:"bg",p0:p,vb0:Object.assign({},S.vb),sx:e.clientX,sy:e.clientY,moved:false};
    svg.setPointerCapture(e.pointerId);e.preventDefault();
  });
  svg.addEventListener("pointermove",function(e){
    if(!drag)return;var p=svgPt(svg,e);
    if(drag.type==="fit"){if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8)return;drag.moved=true;
      drag.f.x=Math.max(0,Math.min(1000,drag.x0+p.x-drag.p0.x));drag.f.y=Math.max(0,Math.min(1500,drag.y0+p.y-drag.p0.y));redrawSvg(j)}
    else if(drag.type==="ap"){drag.moved=true;var a=j.appx[drag.k],dy=p.y-drag.p0.y,a0=drag.a0;
      if(drag.part==="body"){a.y=a0.y+dy;if(drag.k==="bilge")a.dx=Math.max(40,Math.min(300,Math.abs(a0.dx+(p.x>500?1:-1)*(p.x-drag.p0.x))))}
      else{var top=a0.y-a0.len/2,bot=a0.y+a0.len/2;if(drag.part==="top")top=Math.min(bot-40,top+dy);else bot=Math.max(top+40,bot+dy);a.y=(top+bot)/2;a.len=bot-top}
      redrawSvg(j)}
    else if(drag.type==="bg"&&S.vb.w<1000){var r=svg.getBoundingClientRect(),k=S.vb.w/Math.min(r.width,r.height*2/3);
      S.vb.x=drag.vb0.x-(e.clientX-drag.sx)*k;S.vb.y=drag.vb0.y-(e.clientY-drag.sy)*k;if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;clampVb();redrawSvg(j)}
  });
  svg.addEventListener("pointerup",function(e){
    var d=drag;drag=null;if(!d)return;var p=svgPt(svg,e);
    if(d.type==="fit"){if(d.moved)persist(j);else{S.fit=d.f.fid;S.confirmFit=false;renderSheet()}}
    else if(d.type==="ap"){if(d.moved)persist(j)}
    else if(d.type==="bg"&&!d.moved&&S.mode){
      var kind=S.mode,fid=uid(),f={fid:fid,kind:kind,id:nextId(j,kind),x:Math.round(p.x),y:Math.round(p.y)};
      j.fits[fid]=f;persist(j);S.mode="";S.fit=fid;S.confirmFit=false;render();
    }
  });
  svg.addEventListener("pointercancel",function(){drag=null});
}
function loadPhoto(j,file){
  var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var sc=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);var d=c.toDataURL("image/jpeg",.8);URL.revokeObjectURL(u);
    S.imgs[j.id]=d;idb("img","readwrite",function(s){return s.put(d,j.id)});persist(j);render()};
  img.onerror=function(){toast("That photo couldn't be opened.",true)};img.src=u;

  if(n&&!ord)h+='<section class="panel"><b>Not in report order</b><span class="small">Renumber before saving so the drawing and table run in order.</span><button class="btn" id="ren">Renumber now</button></section>';
  if(inc)h+='<p class="msg err">'+inc+' fitting'+(inc>1?"s are":" is")+' still red: details missing.</p>';
  h+='<section><h2>Sketch</h2>'+(S.previewUrl?'<img class="preview" id="pv" src="'+S.previewUrl+'" alt="Through-hull sketch for '+esc(j.vessel)+'">':'<p class="empty">Preparing preview…</p>')+'</section>';
  h+='<section class="panel"><b>Save to Google Drive</b><span class="small">Saves to Surveying › Thro Hulls › “'+esc(j.vessel+" "+j.date)+'”: the Word file (table on a landscape page, sketch on a portrait page), the sketch as a PNG, and the table as a Google Sheet. Files you have edited on Drive are never overwritten; a new copy is made instead.</span>';
  if(!c.url)h+='<span class="msg err">Add the Apps Script URL and key in Settings first.</span>';
  h+='<button class="btn primary" id="drive"'+(S.busy||!c.url||!n?" disabled":"")+'>'+(S.busy?"Saving…":"Save to Drive")+'</button><p class="msg'+(S.msgErr?" err":"")+'" id="toast">'+(S.msg?esc(S.msg):dirty(j)?(j.savedAt?"Changed since last save.":"Not yet saved to Drive."):"Saved to Drive "+new Date(j.savedAt).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+".")+(j.folderUrl?' <a href="'+esc(j.folderUrl)+'" target="_blank" rel="noopener">Open folder</a>':'')+'</p></section>';
  h+='<section class="panel"><b>Share without signal</b><span class="small">Sends the file to another app, such as Files, Mail or OneDrive.</span><div style="display:flex;gap:10px"><button class="btn" id="sharedoc" style="flex:1"'+(n?"":" disabled")+'>Word file</button><button class="btn" id="sharepng" style="flex:1"'+(n?"":" disabled")+'>Sketch PNG</button></div></section></main>';
  return h;
}
function bindOut(j){

function saveDrive(j){
  var c=cfg();if(!c.url||S.busy)return;S.busy=true;S.msg="Saving to Drive…";S.msgErr=false;render();
  var stamp=j.updatedAt;
  makeOutputs(j).then(function(o){return Promise.all([blobB64(o.png),blobB64(o.docx)])}).then(function(b){
    return fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:c.key,vessel:j.vessel,date:j.date,sheet:sheetRows(j),png:b[0],docx:b[1]})});
  }).then(function(r){return r.json()}).then(function(d){
    S.busy=false;
    if(!d.ok){S.msg="Drive refused the save: "+(d.error||"unknown error");S.msgErr=true;render();return}
    j.savedAt=Math.max(stamp,Date.now());j.updatedAt=stamp;j.folderUrl=d.folderUrl;flush(j.id);
    var kept=(d.files||[]).filter(function(f){return f.status==="copy"});
    S.msg="Saved to Drive."+(kept.length?" You had edited "+kept.map(function(f){return f.was}).join(" and ")+" on Drive, so "+(kept.length>1?"new copies were":"a new copy was")+" saved beside "+(kept.length>1?"them":"it")+".":"");S.msgErr=false;render();
  }).catch(function(){S.busy=false;S.msg="Couldn't reach Drive. Nothing is lost; try again when you have signal, or share the Word file instead.";S.msgErr=true;render()});
}

var NOTES="<h3>Heeled waterline (ISO 9093)</h3>\n<p>The heeled waterline is the loaded waterline with the vessel heeled to:</p>\n<ul><li>7\u00b0 for motorboats and multihulls;</li><li>30\u00b0 for sailing monohulls and motorsailers, or the angle at which the sheer amidships is immersed if that is lower.</li></ul>\n<p>The app takes the height of the heeled waterline at the hull side as half the beam \u00d7 tan(heel angle), rounded to the nearest 5 mm. That is about 0.06 \u00d7 beam for a motorboat and 0.29 \u00d7 beam for a sailing boat. It ignores flare, sinkage and trim, and uses the overall beam, so it slightly overstates the height.</p>\n<h3>Requirements by height</h3>\n<ul>\n<li><b>Below the heeled waterline:</b> a seacock, permanently attached and readily accessible, with double-clamped hose connections.</li>\n<li><b>Above the heeled waterline but below the required downflooding height</b> (fittings connected to an open system such as a sink, cockpit drain or bilge outlet): the pipework must stay watertight up to the required height, for example a hose looped up inside the hull. ISO 9093 does not require a seacock or double clamps here. Not confirmed: whether a seacock alone satisfies ISO 12217.</li>\n<li><b>Above both:</b> no specific requirement.</li>\n</ul>\n<p><b>Older guidance (superseded):</b> ISO 9093-1 is reported to have required double hose clamps where the fitting's centreline was less than 300 mm above the static loaded waterline on sailing boats, or 150 mm on motorboats. Not verified against the standard.</p>\n<h3>Downflooding height (ISO 12217)</h3>\n<p>Measured from the calm, fully loaded waterline to the lowest point where water can enter the interior. The required height depends on hull length, beam, displacement and design category. For small hull-side openings the category minimum normally governs.</p>\n<table><tr><th>Category</th><th>Conditions</th><th>Min</th><th>Max</th></tr>\n<tr><td>B Offshore</td><td>Up to Beaufort 8; waves up to 4 m</td><td>400 mm</td><td>1,410 mm</td></tr>\n<tr><td>C Inshore</td><td>Up to Beaufort 6; waves up to 2 m</td><td>300 mm</td><td>750 mm</td></tr>\n<tr><td>D Sheltered</td><td>Up to Beaufort 4; waves up to 0.3 m</td><td>200 mm</td><td>400 mm</td></tr></table>\n<p>Category A (Ocean): minimum 500 mm.</p>\n<h3>Inland boats</h3>\n<p>Boat Safety Scheme, non-private boats (standards 10.3 and 10.4): hull openings at least 250 mm above the normal laden waterline, or permanently connected to watertight pipes or ducts rising to that height; a readily accessible valve on any opening below the waterline. Advisory for private boats.</p>\n<h3>Inspection height</h3>\n<p>Set for each job on the Table tab; the default is 400 mm, the Category B minimum. Apertures within that height are lettered and assessed; apertures below the waterline are numbered.</p>\n<h3>How reliable these notes are</h3>\n<p>Checked against source documents: the 7\u00b0 and 30\u00b0 heel angles (ISO 9093) and the 250 mm Boat Safety Scheme figure. Not checked, taken from an AI summary: the ISO 12217 minimum and maximum heights and the older ISO 9093-1 clamp heights.</p>\n";
